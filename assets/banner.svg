<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-label="Hazardsecurity: software for the small jobs of every day">
  <defs>
    <pattern id="stripes" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="36" height="36" fill="#ffd400"/>
      <rect width="18" height="36" fill="#0f0f0e"/>
    </pattern>
    <pattern id="stripesSm" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="9" height="9" fill="#ffd400"/>
      <rect width="4.5" height="9" fill="#0f0f0e"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="380" rx="28"/></clipPath>
  </defs>
  <style>
    .t { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .title { font-weight: 800; letter-spacing: -2px; fill: #0f0f0e; }
    .tag { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; letter-spacing: 3px; fill: #4f4d48; }
    .tape-text { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; font-size: 17px; letter-spacing: 4px; fill: #0f0f0e; }
    .run-l { animation: runL 22s linear infinite; }
    .run-r { animation: runR 26s linear infinite; }
    @keyframes runL { from { transform: translateX(0); } to { transform: translateX(-600px); } }
    @keyframes runR { from { transform: translateX(-600px); } to { transform: translateX(0); } }
    .swipe { transform-origin: 0 0; transform-box: fill-box; animation: swipe 6s cubic-bezier(.4,0,.05,1) infinite; }
    @keyframes swipe { 0% { transform: scaleX(0); } 14%, 88% { transform: scaleX(1); } 100% { transform: scaleX(0); } }
    @media (prefers-reduced-motion: reduce) { .run-l, .run-r, .swipe { animation: none; } }
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="380" fill="#efede6"/>
    <!-- tapes -->
    <g transform="translate(0 292) rotate(-3 600 30)">
      <rect x="-60" y="0" width="1320" height="54" fill="url(#stripes)"/>
      <rect x="-60" y="8" width="1320" height="38" fill="#ffd400"/>
      <g class="run-l"><text class="tape-text" x="0" y="33" xml:space="preserve">SOFTWARE FOR DAILY NEEDS  ◆  SOFTWARE FOR DAILY NEEDS  ◆  SOFTWARE FOR DAILY NEEDS  ◆  SOFTWARE FOR DAILY NEEDS  ◆  SOFTWARE FOR DAILY NEEDS  ◆  SOFTWARE FOR DAILY NEEDS  ◆</text></g>
    </g>
    <g transform="translate(0 306) rotate(2.5 600 30)">
      <rect x="-60" y="0" width="1320" height="54" fill="url(#stripes)"/>
      <rect x="-60" y="8" width="1320" height="38" fill="#ffd400"/>
      <g class="run-r"><text class="tape-text" x="0" y="33" xml:space="preserve">HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆  HAZARDSECURITY STUDIO  ◆</text></g>
    </g>
    <!-- wordmark -->
    <g transform="translate(56 50)">
      <rect width="34" height="34" rx="8" fill="#0f0f0e"/>
      <rect x="3" y="3" width="28" height="28" rx="6" fill="url(#stripesSm)"/>
      <text class="t" x="48" y="25" font-weight="700" font-size="22" fill="#0f0f0e" letter-spacing="-0.5">hazardsecurity<tspan font-family="ui-monospace, Menlo, monospace" font-weight="400" font-size="15" fill="#77736a">.xyz</tspan></text>
    </g>
    <text class="tag" x="56" y="122">INDEPENDENT SOFTWARE STUDIO</text>
    <!-- headline; "every day." sits on its own line so the highlighter lines up in any font -->
    <text class="t title" x="54" y="172" font-size="54">Software for the small jobs of</text>
    <rect class="swipe" x="50" y="208" width="236" height="22" rx="3" fill="#ffd400"/>
    <text class="t title" x="54" y="230" font-size="54">every day.</text>
  </g>
</svg>
