    <text class="m" x="66" y="56" font-size="11" fill="#6e675d">NDA-2026-0417.pdf</text>
    <text class="s" x="66" y="88" font-size="24" fill="#121110">Mutual Non-Disclosure Agreement</text>
    <rect x="66" y="104" width="420" height="7" rx="3.5" fill="#ebe5d8"/>
    <rect x="66" y="120" width="380" height="7" rx="3.5" fill="#ebe5d8"/>
    <rect x="66" y="136" width="400" height="7" rx="3.5" fill="#ebe5d8"/>
    <path class="sig" d="M72 222c10-6 18-30 26-40 6-8 9 2 6 12-4 14-10 26-6 28 6 3 14-18 20-24 4-4 6 2 4 8-2 8 2 10 8 4 8-8 12-20 18-20 5 0 1 14 6 16 6 2 10-12 16-12 4 0 2 10 8 10 8 0 12-10 20-12 10-2 18 4 30-2" fill="none" stroke="#121110" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="66" y1="232" x2="330" y2="232" stroke="#121110" stroke-opacity=".45"/>
    <text x="66" y="250" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#6e675d">Signed and sealed in the browser</text>
