<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" role="img" aria-label="HazardSign AI: a document signs itself and is sealed">
  <style>
    .sig { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 6s cubic-bezier(.65,0,.35,1) infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 520; } 30%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; opacity: 0; } }
    .seal { transform-origin: 488px 214px; animation: stamp 6s cubic-bezier(.2,1.4,.4,1) infinite; opacity: 0; }
    @keyframes stamp { 0%, 32% { opacity: 0; transform: scale(1.8) rotate(-40deg); } 40%, 90% { opacity: 1; transform: scale(1) rotate(-12deg); } 100% { opacity: 0; transform: scale(1) rotate(-12deg); } }
    .hash { animation: fade 6s linear infinite; }
    @keyframes fade { 0%, 40% { opacity: 0; } 46%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .sig, .seal, .hash { animation: none; stroke-dashoffset: 0; opacity: 1; } .seal { transform: rotate(-12deg); } }
    .m { font-family: ui-monospace, Menlo, Consolas, monospace; }
    .s { font-family: Georgia, "Times New Roman", serif; }
  </style>
  <rect width="600" height="300" rx="24" fill="#f3efe6"/>
  <g transform="rotate(-1.5 300 150)">
